---
name: Build rust-builder

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/rust-builder/Dockerfile"
      - "apps/rust-builder/Dockerfile.*"
  pull_request:
    branches: [main]
    paths:
      - "apps/rust-builder/Dockerfile"
      - "apps/rust-builder/Dockerfile.*"
      - ".github/workflows/build-rust-builder.yaml"
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: "${{ steps.version.outputs.version }}"
    steps:
      - name: Set version
        id: version
        run: |
          set -ex

          echo "version=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build:
    uses: heathcliff26/ci/.github/workflows/build-containers.yaml@main
    needs: metadata
    permissions:
      contents: read
      packages: write
    with:
      images: |
        name=rust-builder,tags=${{ needs.metadata.outputs.version }} latest,context=apps/rust-builder
        name=rust-qt-builder,tags=${{ needs.metadata.outputs.version }} latest,context=apps/rust-builder,containerfile=Dockerfile.qt,buildargs=BASE_IMAGE=ghcr.io/heathcliff26/rust-builder:${{ needs.metadata.outputs.version }}
      dry-run: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    secrets: inherit
