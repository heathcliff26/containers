---
name: Build go-fyne-ci

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/go-fyne-ci/Dockerfile"
      - "apps/go-fyne-ci/Dockerfile.android"
  pull_request:
    branches: [main]
    paths:
      - "apps/go-fyne-ci/Dockerfile"
      - "apps/go-fyne-ci/Dockerfile.android"
      - ".github/workflows/build-go-fyne-ci.yaml"
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: "${{ steps.version.outputs.version }}"
    steps:
      - name: Set version
        id: version
        run: |
          set -ex

          echo "version=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build:
    uses: heathcliff26/ci/.github/workflows/build-containers.yaml@main
    needs: metadata
    permissions:
      contents: read
      packages: write
    with:
      images: |
        name=go-fyne-ci,tags=${{ needs.metadata.outputs.version }} latest,context=apps/go-fyne-ci
        name=go-fyne-ci,tags=${{ needs.metadata.outputs.version }}-android latest-android,context=apps/go-fyne-ci,containerfile=Dockerfile.android,buildargs=BASE_IMAGE=ghcr.io/heathcliff26/go-fyne-ci:${{ needs.metadata.outputs.version }}
      dry-run: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    secrets: inherit
