---
name: Build rust-qt-builder

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/rust-qt-builder/*"
  pull_request:
    branches: [main]
    paths:
      - "apps/rust-qt-builder/*"
      - ".github/workflows/build-rust-qt-builder.yaml"
  merge_group:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: "${{ steps.version.outputs.version }}"
    steps:
      - name: Set version
        id: version
        run: |
          set -ex

          echo "version=$(date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build:
    uses: heathcliff26/ci/.github/workflows/build-amd64-container.yaml@main
    needs: metadata
    permissions:
      contents: read
      packages: write
    with:
      app: rust-qt-builder
      tag: "${{ needs.metadata.outputs.version }}"
      dry-run: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
      context: apps/rust-qt-builder
    secrets: inherit
